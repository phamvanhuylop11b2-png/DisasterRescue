<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M50 8 L85 22 C85 58 50 88 50 92 C50 88 15 58 15 22 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner Shield Glow -->
  <path d="M50 14 L79 26 C79 56 50 82 50 85 C50 82 21 56 21 26 Z" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none"/>

  <!-- Water / Disaster Waves Waveform at Bottom of Shield -->
  <path d="M25 64 Q38 56 50 64 T75 64 C75 64 68 76 50 84 C32 76 25 64 25 64 Z" fill="url(#waveGrad)" opacity="0.95"/>

  <!-- Rescue Cross / Beacon of Hope in Center -->
  <g fill="#FFFFFF">
    <rect x="44" y="28" width="12" height="26" rx="3" />
    <rect x="37" y="35" width="26" height="12" rx="3" />
  </g>

  <!-- Lifebuoy Ring Accent -->
  <circle cx="50" cy="41" r="18" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.85" stroke-dasharray="8 6"/>

  <!-- Star of Life / Pulse -->
  <circle cx="50" cy="41" r="4" fill="#EA580C" />
</svg>
