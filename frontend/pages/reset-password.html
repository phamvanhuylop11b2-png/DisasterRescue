<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu | Hệ thống Cứu hộ Thiên tai</title>
  <meta name="description" content="Đặt mật khẩu mới cho tài khoản hệ thống cứu hộ thiên tai.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/rescue-logo.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <header class="auth-brand">
      <div class="brand-logo-wrapper">
        <img src="../assets/images/rescue-logo.svg" alt="Biểu tượng Cứu hộ Thiên tai" class="brand-logo">
      </div>
      <h1 class="brand-title">HỆ THỐNG CỨU HỘ THIÊN TAI</h1>
      <p class="brand-subtitle">Quản lý và điều phối cứu hộ, cứu trợ</p>
    </header>

    <section class="auth-card" aria-labelledby="reset-title">
      <div class="card-header">
        <h2 id="reset-title" class="card-title">Đặt lại mật khẩu</h2>
        <p class="card-desc">Tạo mật khẩu mới an toàn cho tài khoản của bạn (từ 8 đến 72 ký tự, bao gồm cả chữ và số).</p>
      </div>

      <div id="alert-container" class="alert alert-danger" style="display: none;" role="alert" aria-live="polite">
        <svg class="alert-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span id="alert-text"></span>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="new-password" class="form-label">Mật khẩu mới</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="new-password"
              name="newPassword"
              class="form-input"
              placeholder="Nhập mật khẩu mới"
              autocomplete="new-password"
              required
              aria-describedby="error-password"
            >
          </div>
          <div id="error-password" class="field-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Xác nhận mật khẩu mới</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              class="form-input"
              placeholder="Nhập lại mật khẩu mới"
              autocomplete="new-password"
              required
              aria-describedby="error-confirm-password"
            >
          </div>
          <div id="error-confirm-password" class="field-error" role="alert"></div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-submit">
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
          <span id="btn-text">Đặt lại mật khẩu</span>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="login.html" class="forgot-link">← Quay lại trang đăng nhập</a>
      </div>
    </section>

    <footer class="auth-footer">
      <p>&copy; 2026 Hệ thống Cứu hộ Thiên tai Quốc gia. Bảo lưu mọi quyền.</p>
    </footer>
  </main>

  <button id="theme-toggle-btn" class="theme-switch-btn" aria-label="Đổi giao diện sáng/tối">🌙</button>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
