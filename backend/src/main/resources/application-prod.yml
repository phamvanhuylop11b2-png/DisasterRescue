spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/disaster_rescue?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
