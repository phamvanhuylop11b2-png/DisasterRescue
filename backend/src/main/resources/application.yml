server:
  port: 8080

spring:
  application:
    name: disaster-rescue-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# App configurations
app:
  jwt:
    secret: ${JWT_SECRET:4c696e685f6375755f686f5f746869656e5f7461695f64697361737465725f7265736375655f7365637265745f6b65795f32303236}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 86400
    refresh-token-remember-me-seconds: 2592000
    reset-password-expiration-seconds: 1800
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080}
  frontend-reset-url: ${FRONTEND_RESET_URL:http://127.0.0.1:5500/frontend/pages/reset-password.html}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
